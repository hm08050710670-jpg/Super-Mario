<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スーパーノブオ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
:root{--bg:#120f1f;--ink:#f3ecd8;--acc:#ffd23f;--pad:#2a2340;--pad2:#3b3258;--edge:#05040a}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16",ui-monospace,"Hiragino Kaku Gothic ProN",monospace;display:flex;flex-direction:column;align-items:center;padding-inline:16px;box-sizing:border-box;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;padding-block:12px 4px;box-sizing:border-box}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;max-width:100%;border-radius:6px;box-shadow:0 0 0 3px var(--edge),0 0 0 6px var(--pad),0 18px 40px rgba(0,0,0,.5);outline:none}
#help{font-size:13px;letter-spacing:.04em;opacity:.75;padding-block:8px 14px;text-align:center;line-height:1.7}
#help b{color:var(--acc);font-weight:400}
#touch{display:none;flex:0 0 auto;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:max(640px,calc(var(--u)*1.02));padding-inline:8px;padding-block:4px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;
  --u:min(var(--ui,100vw),100vw);
  --bw:max(4px,calc(var(--u)*.0095));--iw:max(6px,calc(var(--u)*.0142));
  --dpw:max(118px,calc(var(--u)*.43));--dph:max(132px,calc(var(--u)*.49));--abw:max(52px,calc(var(--u)*.195));
  --rimB:linear-gradient(180deg,#a8e2ff 0%,#3a9bf5 20%,#0f3fb0 58%,#2f86e8 82%,#6fc6ff 100%)}
#touch .main{display:flex;width:100%;justify-content:space-between;align-items:flex-start}
/* D-pad: two tall purple keys in a black bezel with a blue chrome rim */
#touch .dir{display:flex;gap:4px;align-items:stretch;box-sizing:border-box;
  width:var(--dpw);height:var(--dph);border:var(--bw) solid transparent;border-radius:max(26px,calc(var(--u)*.062));padding:max(6px,calc(var(--u)*.014));
  background:linear-gradient(#0d0c13,#0d0c13) padding-box,var(--rimB) border-box;
  box-shadow:0 6px 0 #06050b,0 14px 26px rgba(0,0,0,.6)}
#touch .dir button{flex:1;height:100%;border:0;padding:0;color:#f7edd2;
  font-size:max(24px,calc(var(--u)*.076));line-height:1;text-shadow:3px 3px 0 rgba(0,0,0,.4);
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.06) 20%,rgba(255,255,255,0) 40%),
             linear-gradient(175deg,#9a6ae0 0%,#7c48c2 34%,#5c2d99 72%,#47207d 100%)}
#touch .dir button:first-child{border-radius:max(20px,calc(var(--u)*.047)) max(7px,calc(var(--u)*.017)) max(7px,calc(var(--u)*.017)) max(20px,calc(var(--u)*.047))}
#touch .dir button:last-child{border-radius:max(7px,calc(var(--u)*.017)) max(20px,calc(var(--u)*.047)) max(20px,calc(var(--u)*.047)) max(7px,calc(var(--u)*.017))}
#touch .dir button.on{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 34%),
  linear-gradient(175deg,#6b3ca8 0%,#542b8c 40%,#3a1a66 100%);box-shadow:inset 0 4px 10px rgba(0,0,0,.5)}
/* A / B: tall capsules, same rim and bezel */
#touch .ab{display:flex;align-items:flex-start;gap:max(8px,calc(var(--u)*.031))}
#touch button.a,#touch button.b{box-sizing:border-box;width:var(--abw);height:var(--dph);
  border:var(--bw) solid transparent;border-radius:999px;padding:0;
  color:#f7edd2;font-family:"Press Start 2P",ui-monospace,monospace;font-size:max(15px,calc(var(--u)*.047));
  line-height:1;text-shadow:3px 3px 0 rgba(0,0,0,.4);
  box-shadow:inset 0 0 0 var(--iw) #0d0c13,0 6px 0 #06050b,0 14px 26px rgba(0,0,0,.6)}
#touch button.b{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 22%,rgba(255,255,255,0) 42%) padding-box,
  linear-gradient(180deg,#5cc2ff 0%,#2a86ec 34%,#1356c8 74%,#0b3d9e 100%) padding-box,var(--rimB) border-box}
#touch button.a{margin-top:7px;background:linear-gradient(180deg,rgba(255,255,255,.44),rgba(255,255,255,.07) 22%,rgba(255,255,255,0) 42%) padding-box,
  linear-gradient(180deg,#ff6f62 0%,#ec3328 34%,#c81d16 74%,#9a110c 100%) padding-box,var(--rimB) border-box}
#touch button.a.on,#touch button.b.on{transform:translateY(3px);
  box-shadow:inset 0 0 0 var(--iw) #0d0c13,inset 0 6px 12px rgba(0,0,0,.45),0 2px 0 #06050b,0 6px 14px rgba(0,0,0,.5)}
#touch button.b.on{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 34%) padding-box,
  linear-gradient(180deg,#2b7ac4 0%,#1a5aa6 40%,#0a3574 100%) padding-box,var(--rimB) border-box}
#touch button.a.on{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 34%) padding-box,
  linear-gradient(180deg,#c8352a 0%,#a51f18 40%,#6d0c09 100%) padding-box,var(--rimB) border-box}
/* small centre pills */
#touch .mid{display:flex;gap:10px;align-items:center;margin-top:2px}
#touch .mid button{font-family:inherit;width:max(46px,calc(var(--u)*.133));height:max(28px,calc(var(--u)*.077));border-radius:999px;
  border:2px solid transparent;padding:0;color:#d8d2e6;font-size:max(11px,calc(var(--u)*.031));
  background:linear-gradient(#232032,#232032) padding-box,var(--rimB) border-box;
  box-shadow:0 3px 0 #06050b}
#touch .mid button.on{color:#fff;background:linear-gradient(#3b3258,#3b3258) padding-box,var(--rimB) border-box;transform:translateY(2px);box-shadow:0 1px 0 #06050b}
#touch button{touch-action:none;-webkit-tap-highlight-color:transparent;font-family:inherit}
@media (pointer:coarse){#touch{display:flex}#help{display:none}body{padding-inline:4px}#wrap{align-items:flex-start;padding-block:20px 0}}
@media (prefers-reduced-motion:reduce){#touch button{transition:none}}
</style>

<div id="touch">

  </div>
  <div class="mid"><button data-k="mute" aria-label="音のオンオフ">おと</button><button data-k="start" aria-label="スタート・ポーズ">START</button></div>
</div>

const tileAt=(tx,ty)=>{if(tx<0||tx>=lvl.w)return 'X';if(ty<0||ty>=15)return '.';return lvl.g[ty][tx];};
const solid=t=>SOLIDS.has(t);
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const pad=(n,l)=>String(Math.max(0,Math.floor(n))).padStart(l,'0');

function collideX(e){
  const top=Math.floor(e.y/T),bot=Math.floor((e.y+e.h-1)/T);
  if(e.vx>0){const tx=Math.floor((e.x+e.w-1)/T);for(let ty=top;ty<=bot;ty++)if(solid(tileAt(tx,ty))){e.x=tx*T-e.w;e.vx=0;return true;}}
  else if(e.vx<0){const tx=Math.floor(e.x/T);for(let ty=top;ty<=bot;ty++)if(solid(tileAt(tx,ty))){e.x=(tx+1)*T;e.vx=0;return true;}}
  return false;
}
function collideY(e,pb){
  e.onGround=false;const l=Math.floor(e.x/T),r=Math.floor((e.x+e.w-1)/T);
  if(e.vy>=0){const ty=Math.floor((e.y+e.h-0.01)/T);
    for(let tx=l;tx<=r;tx++){const t=tileAt(tx,ty);if(solid(t)||(t==='='&&pb<=ty*T+0.5)){e.y=ty*T-e.h;e.vy=0;e.onGround=true;return null;}}}
  else{const ty=Math.floor(e.y/T);let hit=null;const cx=Math.floor((e.x+e.w/2)/T);
    if(solid(tileAt(cx,ty)))hit=cx;else for(let tx=l;tx<=r;tx++)if(solid(tileAt(tx,ty))){hit=tx;break;}
    if(hit!==null){
      // corner forgiveness: nudge around a block edge when barely clipping it
      if(e===P&&hit!==cx){const edge=hit<cx?(hit+1)*T:hit*T;const d=hit<cx?edge-e.x:e.x+e.w-edge;if(d<=5){e.x+=hit<cx?d:-d;return null;}}
      e.y=(ty+1)*T;e.vy=0;return {tx:hit,ty};}}
  return null;
}

function popText(x,y,s){parts.push({k:'txt',x,y,s:String(s),t:0});}

function flameBurst(cx,cy){
  for(let i=0;i<14;i++){const a=Math.PI*2*i/14+Math.random()*0.3,sp=1.1+Math.random()*1.3;
    parts.push({k:'fl',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.7,t:0,r:(Math.random()*2)|0});}

  else if(d.t==='u')ents.push({type:'uni',x:x+1,y:y+3,w:14,h:13,vx:0,vy:0,dir:-1,t:0});
  else if(d.t==='b')ents.push({type:'bike',x:x-7,y:y-14,w:30,h:30,vx:0,vy:0,dir:-1,t:0});
  else if(d.t==='k')ents.push({type:'crow',x,y,by:y,w:14,h:10,vx:-0.9,vy:0,dir:-1,t:0});
  else if(d.t==='mp')ents.push({type:'mp',x,y,ox:x,oy:y,w:48,h:8,ax:d.ax,range:d.range,sp:d.sp,ph:d.ph,t:0,dx:0,dy:0,py:y});
}
function kill(e,dir,pts){
  const spr=e.type==='bike'?(e.dir>0?BIKER:BIKE)[0]:e.type==='dar'?(e.dir>0?DARR:DAR)[0]:e.type==='uni'?(e.dir>0?UNIR:UNI)[0]:CROW[0][e.dir>0?0:1];
  e.type='flip';e.spr=spr;e.vy=-4.5;e.vx=(dir||1)*1.1;e.t=0;SFX.kill();addScore(pts||200,e.x,e.y);
}
const KILLABLE=new Set(['dar','uni','crow','bike']);

function bumpTile(tx,ty){
  const t=tileAt(tx,ty);
  if(t==='B'){
    if(P.form>0){lvl.g[ty][tx]='.';SFX.brk();addScore(50);
      for(let i=0;i<4;i++)parts.push({k:'brk',x:tx*T+(i%2)*8,y:ty*T+(i>1?8:0),vx:(i%2?1.4:-1.4),vy:i>1?-4:-6,t:0});}
    else{bumps.push({tx,ty,t:0});SFX.bump();}
  }else if(t==='?'){lvl.g[ty][tx]='U';bumps.push({tx,ty,t:0});ents.push({type:'coinpop',x:tx*T,y:ty*T-16,w:16,h:16,vy:-5.5,t:0});addCoin();}
  else if(t==='M'){lvl.g[ty][tx]='U';bumps.push({tx,ty,t:0});SFX.item();
    const it=P.form===0?'oni':'chili';ents.push({type:it,x:tx*T+1,y:ty*T,w:14,h:15,vx:0,vy:0,dir:1,emerge:16,t:0});}
  else SFX.bump();
  // things sitting on top of the bumped tile
  for(const e of ents)if(KILLABLE.has(e.type)&&e.x+e.w>tx*T&&e.x<tx*T+T&&Math.abs(e.y+e.h-ty*T)<4)kill(e,e.x+e.w/2<tx*T+8?-1:1,100);
  for(const e of ents)if(e.type==='oni'&&!e.emerge&&e.x+e.w>tx*T&&e.x<tx*T+T&&Math.abs(e.y+e.h-ty*T)<4){e.vy=-4;e.dir=e.x+e.w/2<tx*T+8?-1:1;}
  if(tileAt(tx,ty-1)==='c'){lvl.g[ty-1][tx]='.';ents.push({type:'coinpop',x:tx*T,y:(ty-1)*T,w:16,h:16,vy:-5,t:0});addCoin();}
}

function hurt(){
  if(P.inv>0||P.growT>0||G.state!=='play')return;
  if(P.form>0){setForm(0);P.inv=120;freeze=30;SFX.shrink();}
  else die(false);
}
function die(pit){
  if(G.state!=='play')return;
  G.state='dead';G.stateT=pit?60:0;P.pit=pit;G.form=0;P.vx=0;P.vy=0;Music.stop();SFX.die();
}
function stompPoints(){const tbl=[100,200,400,500,800,1000,2000,4000,5000,8000];const v=tbl[Math.min(chain,tbl.length-1)];chain++;return chain>10?'1UP':v;}

// ================= UPDATE =================
function updPlayer(inp){
  if(P.inv>0)P.inv--;
  if(P.fireCD>0)P.fireCD--;
  const L=inp.left,R=inp.right;const max=inp.run?3.05:1.75;const acc=P.onGround?0.12:0.09;
  P.skid=false;
  if(L&&!R){P.dir=-1;if(P.vx>0&&P.onGround){P.vx-=0.3;P.skid=true;}else P.vx-=acc;}
  else if(R&&!L){P.dir=1;if(P.vx<0&&P.onGround){P.vx+=0.3;P.skid=true;}else P.vx+=acc;}
  else if(P.onGround){P.vx*=0.85;if(Math.abs(P.vx)<0.08)P.vx=0;}
  if(Math.abs(P.vx)>max)P.vx=Math.sign(P.vx)*Math.max(max,Math.abs(P.vx)-0.06);
  if(inp.jumpP)P.buf=7;else if(P.buf>0)P.buf--;
  if(P.onGround)P.coy=6;else if(P.coy>0)P.coy--;
  if(P.buf>0&&P.coy>0){P.vy=-(5.3+Math.abs(P.vx)*0.32);P.buf=0;P.coy=0;P.onGround=false;P.ride=null;P.form?SFX.bigjump():SFX.jump();}
  P.vy=Math.min(P.vy+((P.vy<0&&inp.jump)?0.21:0.56),6.5);
  if(inp.runP&&P.form===2&&P.fireCD===0&&ents.filter(e=>e.type==='fire').length<2){
    ents.push({type:'fire',x:P.dir>0?P.x+P.w:P.x-8,y:P.y+(P.h>20?10:4),w:8,h:8,vx:P.dir*4.2,vy:1.5,t:0});SFX.fire();P.fireCD=10;}
  movePlayer();
  // coins
  const l=Math.floor(P.x/T),r=Math.floor((P.x+P.w-1)/T),tp=Math.floor(P.y/T),bt=Math.floor((P.y+P.h-1)/T);
  for(let tx=l;tx<=r;tx++)for(let ty=tp;ty<=bt;ty++)if(tileAt(tx,ty)==='c'){lvl.g[ty][tx]='.';addCoin();parts.push({k:'spark',x:tx*T+8,y:ty*T+8,t:0});}
  if(P.onGround&&!P.ride)chain=0;
  // entities
  for(const e of ents){
    if(e.dead||!overlap(P,e))continue;
    if(e.type==='dar'||e.type==='crow'||e.type==='bike'){
      if(P.vy>0&&P.prevBottom<=e.y+8){
        const pts=stompPoints();if(pts==='1UP')oneUp(e.x,e.y);else addScore(pts,e.x,e.y);
        if(e.type==='dar'){e.type='flat';e.t=0;}
        else if(e.type==='bike'){const sp=(e.dir>0?BIKER:BIKE)[0];e.type='flip';e.spr=sp;e.vy=-2;e.vx=e.dir*0.6;e.t=0;}
        else{e.type='flip';e.spr=CROW[0][e.dir>0?0:1];e.vy=0;e.vx=0;e.t=0;}
        P.vy=prevIn.jump?-6.4:-4.2;P.y=e.y-P.h;SFX.stomp();
      }else hurt();
    }else if(e.type==='uni')hurt();
    else if(e.type==='oni'&&!e.emerge){e.dead=true;addScore(1000,e.x,e.y);if(P.form===0){setForm(1);freeze=36;}SFX.power();}
    else if(e.type==='chili'&&!e.emerge){e.dead=true;addScore(1000,e.x,e.y);if(P.form!==2){setForm(2);freeze=36;}SFX.power();
      flameBurst(P.x+P.w/2,P.y+P.h/2);}
    else if(e.type==='boss'&&e.phase!=='dead'){
      if(P.vy>0&&P.prevBottom<=e.y+12){P.vy=-6.8;P.y=e.y-P.h;if(e.hurt===0){e.hp-=3;e.hurt=60;shake=8;SFX.stomp();SFX.bump();if(e.hp<=0)bossDie(e);}}
      else if(e.hurt<40)hurt();
    }
  }
  if(P.y>H+20)die(true);
}
function movePlayer(){
  if(P.ride){P.x+=P.ride.dx;P.y+=P.ride.dy;}
  const pb=P.y+P.h;P.prevBottom=pb;
  P.x+=P.vx;collideX(P);
  if(P.x<cam){P.x=cam;if(P.vx<0)P.vx=0;}
  if(P.x>lvl.w*T-P.w)P.x=lvl.w*T-P.w;
  if(camLock!==null&&P.x>camLock+W-P.w){P.x=camLock+W-P.w;}
  P.y+=P.vy;
  const hit=collideY(P,pb);
  if(hit&&G.state==='play')bumpTile(hit.tx,hit.ty);
  P.ride=null;
  if(P.vy>=0){for(const m of ents){if(m.type!=='mp')continue;
    if(P.x+P.w>m.x+1&&P.x<m.x+m.w-1&&pb<=m.py+2+Math.max(0,m.dy)&&P.y+P.h>=m.y){P.y=m.y-P.h;P.vy=0;P.onGround=true;P.ride=m;}}}
  if(P.onGround&&Math.abs(P.vx)>0.1)P.anim+=Math.abs(P.vx)*0.085;
}

function walker(e,sp,smart){
  e.vx=e.dir*sp;e.vy=Math.min(e.vy+0.35,6);const pb=e.y+e.h;
  e.x+=e.vx;if(collideX(e))e.dir*=-1;
  e.y+=e.vy;collideY(e,pb);
  if(smart&&e.onGround){const fx=e.dir>0?e.x+e.w+1:e.x-1;const t=tileAt(Math.floor(fx/T),Math.floor((e.y+e.h+2)/T));if(!solid(t)&&t!=='=')e.dir*=-1;}
}
function updEnt(e){
  e.t++;
  switch(e.type){
    case 'dar':walker(e,0.5,false);break;
    case 'uni':walker(e,0.38,true);break;
    case 'bike':walker(e,2.15,false);break;
    case 'crow':e.x+=e.vx;e.y=e.by+Math.sin(e.t*0.06)*18;if(e.x<cam-40||(e.vx>0&&e.x>cam+W+40))e.dead=true;break;
    case 'flat':if(e.t>30)e.dead=true;break;
    case 'flip':e.vy+=0.35;e.x+=e.vx;e.y+=e.vy;break;
    case 'coinpop':e.vy+=0.4;e.y+=e.vy;if(e.t>24){e.dead=true;popText(e.x+2,e.y,200);}break;
    case 'oni':case 'chili':{
      if(e.emerge>0){e.emerge--;e.y-=1;break;}
      if(e.type==='oni'){e.vx=e.dir*1.1;}else e.vx=0;
      e.vy=Math.min(e.vy+0.35,6);const pb=e.y+e.h;e.x+=e.vx;if(collideX(e))e.dir*=-1;e.y+=e.vy;collideY(e,pb);break;}
    case 'fire':{
      e.vy=Math.min(e.vy+0.4,5);const pb=e.y+e.h;e.x+=e.vx;
      if(collideX(e)){e.dead=true;parts.push({k:'poof',x:e.x+4,y:e.y+4,t:0});SFX.bump();break;}
      e.y+=e.vy;collideY(e,pb);if(e.onGround)e.vy=-3.4;
      if(e.x<cam-16||e.x>cam+W+16||e.t>200)e.dead=true;
      for(const o of ents){if(o.dead||o===e)continue;
        if(KILLABLE.has(o.type)&&overlap(e,o)){kill(o,e.vx>0?1:-1,200);e.dead=true;parts.push({k:'poof',x:e.x+4,y:e.y+4,t:0});break;}
        if(o.type==='boss'&&o.phase!=='dead'&&overlap(e,o)){e.dead=true;parts.push({k:'poof',x:e.x+4,y:e.y+4,t:0});if(o.hurt<30){o.hp-=1;o.hurt=36;SFX.kill();if(o.hp<=0)bossDie(o);}break;}}
      break;}
    case 'mp':{const a=Math.sin(e.t*e.sp+e.ph)*e.range;const nx=e.ax==='x'?e.ox+a:e.ox,ny=e.ax==='y'?e.oy+a:e.oy;
      e.dx=nx-e.x;e.dy=ny-e.y;e.py=e.y;e.x=nx;e.y=ny;if(e.x+e.w+e.range<cam-64)e.dead=true;break;}
    case 'boss':updBoss(e);break;
  }
  if(e.type!=='mp'&&e.type!=='boss'&&(e.y>H+48||e.x<cam-96))e.dead=true;
}
function updBoss(e){
  if(e.phase==='dead'){e.vy+=0.2;e.y+=e.vy;if(e.t%7===0&&e.y<H)parts.push({k:'poof',x:e.x+Math.random()*28,y:e.y+Math.random()*28,t:0});return;}
  if(e.hurt>0)e.hurt--;
  const wasAir=!e.onGround;
  e.vy=Math.min(e.vy+0.38,7);
  const rage=(e.maxhp-e.hp)*9/e.maxhp;const spd=0.65+rage*0.12+(e.kind==='karasu'?0.15:0)+(e.kind==='uber'?0.3:0);
  if(e.onGround){
    if(e.t%30===0)e.dir=(P.x+P.w/2<e.x+e.w/2)?-1:1;
    e.vx=e.dir*spd;e.jumpT--;
    if(e.jumpT<=0){e.vy=-(6+Math.random()*2.2);e.vx=e.dir*(spd+0.9);e.jumpT=90-rage*5+Math.floor(Math.random()*40);}
  }
  const pb=e.y+e.h;e.x+=e.vx;if(collideX(e)){e.dir*=-1;e.vx=e.dir*spd;}
  if(e.x<camLock+2){e.x=camLock+2;e.dir=1;}
  e.y+=e.vy;collideY(e,pb);
  if(wasAir&&e.onGround&&e.t>5){shake=14;SFX.land();e.lands++;
    if(P.onGround&&P.inv===0&&G.state==='play'){P.vy=-3.2;P.onGround=false;}
    if(e.kind==='uber'){ // the boss calls in a courier every other landing
      if(e.lands%2===0&&ents.filter(o=>o.type==='bike').length<1){const d=P.x<e.x?-1:1;
        ents.push({type:'bike',x:e.x+4,y:e.y+4,w:30,h:30,vx:0,vy:-3,dir:d,t:0});}}
    else if(e.kind==='karasu'){if(e.lands%2===0&&ents.filter(o=>o.type==='crow').length<3){const d=P.x<e.x?-1:1;ents.push({type:'crow',x:e.x+8,y:e.y,by:e.y-8,w:14,h:10,vx:d*1.3,vy:0,dir:d,t:0});}}
    else if(e.lands%3===0&&ents.filter(o=>o.type==='dar').length<2){const d={type:'dar',x:e.x+7,y:e.y+8,w:14,h:14,vx:0,vy:-4,dir:e.dir,t:0};ents.push(d);}
  }
}
function bossDie(e){
  e.phase='dead';e.vy=-5;e.vx=0;e.t=0;SFX.boom();shake=30;addScore(5000,e.x,e.y);
  for(const o of ents)if(KILLABLE.has(o.type))kill(o,1,100);
  G.state='goal';G.gphase='boss';G.stateT=0;Music.stop();
}

function startGoal(){
  G.state='goal';G.gphase='slide';G.stateT=0;Music.stop();SFX.pole();
  const rel=(13*T-(P.y+P.h))/T;const pts=rel>=9?5000:rel>=7?2000:rel>=5?800:rel>=3?400:rel>=1?200:100;
  addScore(pts,lvl.pole*T+10,P.y);
  P.x=lvl.pole*T+7-P.w;P.vx=0;P.vy=0;P.dir=1;
}
function updGoal(){
  G.stateT++;
  if(G.gphase==='slide'){
    let done=true;
    if(P.y+P.h<13*T){P.y=Math.min(P.y+2.5,13*T-P.h);done=false;}
    if(flagY<11*T+2){flagY+=2.5;done=false;}
    if(done&&G.stateT>30){G.gphase='walk';G.stateT=0;P.x=lvl.pole*T+T+1;P.vy=-2;SFX.clear();}
  }else if(G.gphase==='walk'){
    P.vx=1.2;P.vy=Math.min(P.vy+0.5,6);movePlayer();
    if(P.x>lvl.house*T+32){P.hidden=true;G.gphase='tally';G.stateT=0;}
  }else if(G.gphase==='boss'){
    P.vx*=0.85;P.vy=Math.min(P.vy+0.56,6.5);movePlayer();
    if(G.stateT===80)SFX.bossclear();
    if(G.stateT>260){G.gphase='tally';G.stateT=0;}
  }else if(G.gphase==='tally'){
    if(G.time>0){const d=Math.min(G.time,2);G.time-=d;G.score+=d*50;if(G.frame%4===0)SFX.tick();G.stateT=0;}
    else if(G.stateT>70){
      saveHi();
      if(G.world===STAGES.length-1||WORLD_OF[G.world+1]>WORLD_OF[G.world])saveProg(WORLD_OF[G.world]);
      if(lvl.final){G.state='ending';G.stateT=0;Music.play('ending');}
      else{G.world++;G.check=false;G.state='card';G.stateT=0;}
    }
  }
}

function updCamera(){
  if(lvl.arena&&camLock===null&&P.x>(lvl.arena+3)*T){
    camLock=lvl.arena*T;
    const kind=lvl.boss||'hato',hp0=kind==='uber'?16:kind==='karasu'?12:9;
    const bw=kind==='uber'?38:28,bh=kind==='uber'?34:30;
    boss={type:'boss',kind,x:(lvl.arena+14)*T,y:-60,w:bw,h:bh,vx:0,vy:0,dir:-1,t:0,hp:hp0,maxhp:hp0,hurt:0,jumpT:80,lands:0,phase:'fight'};
    ents.push(boss);Music.play('boss');
  }
  if(camLock!==null){cam+=(camLock-cam)*0.12;if(Math.abs(camLock-cam)<0.5)cam=camLock;}
  else{const tgt=Math.round(P.x+P.w/2)-134;if(tgt>cam)cam=tgt;}
  cam=Math.max(0,Math.min(lvl.w*T-W,cam));
}

function titleStart(w){audioInit();Music.stop();G.score=0;G.coins=0;G.lives=3;G.world=w;G.form=0;G.check=false;G.jt=0;G.state='card';G.stateT=0;SFX.coin();}
function setPause(p){G.paused=p;if(AC){if(p){SFX.pause();setTimeout(()=>{if(G.paused&&AC)AC.suspend();},300);}else AC.resume();}}

function step(){
  const inp=readInput();G.frame++;G.stateT++;
  if(inp.muteP){audioInit();toggleMute();}
  if(G.muteT>0)G.muteT--;
  switch(G.state){
    case 'title':
      if(AC&&!Music.name&&G.stateT>2)Music.play('title');
      if(inp.startP&&inp.run){audioInit();G.state='ending';G.stateT=0;G.form=1;Music.play('ending');break;} // secret: B + START watches the ending
      // secret: hold B down and tap ◀ seven times to watch the ending
      if(inp.run&&inp.leftP){audioInit();
        G.et=(G.stateT-G.etT<140)?G.et+1:1;G.etT=G.stateT;
        if(G.et>=7){G.et=0;G.state='ending';G.stateT=0;G.form=1;Music.play('ending');}else SFX.tick();
        break;}
      // ← together with A is the secret that opens every stage, cleared or not
      if(!G.selOn&&inp.jumpP&&inp.left){audioInit();G.selOn=true;G.sel=STAGES.length-1;G.jt=0;SFX.power();break;}
      {const list=selList();
       if(list.length){
         if(!list.includes(G.sel))G.sel=list[0];
         if(inp.leftP||inp.rightP){const k=list.indexOf(G.sel);G.sel=list[(k+(inp.rightP?1:list.length-1))%list.length];SFX.coin();}
         if(inp.startP||inp.jumpP)titleStart(G.sel);
       }else{ // nothing cleared yet: A alone starts 1-1, but wait a few frames in case ← is coming
         if(inp.jumpP)G.jt=5;else if(G.jt>0)G.jt--;
         if(G.jt>0&&inp.left){audioInit();G.selOn=true;G.sel=STAGES.length-1;G.jt=0;SFX.power();break;}
         if(inp.startP||G.jt===1)titleStart(0);
       }}
      break;
    case 'card':
      if(G.stateT===1){loadLevel(G.world,G.check);SFX.start();}
      if(G.stateT>150||(G.stateT>40&&inp.startP)){G.state='play';G.stateT=0;Music.play(THEMES[lvl.theme].bgm);}
      break;
    case 'play':
      if(inp.startP){setPause(!G.paused);}
      if(G.paused)break;
      if(freeze>0){freeze--;if(P.growT>0)P.growT--;break;}
      if(P.growT>0)P.growT--;
      while(pending.length&&pending[0].x*T<cam+W+32){spawn(pending.shift());}
      for(const e of ents)if(e.type==='mp')updEnt(e);
      updPlayer(inp);
      for(const e of ents)if(e.type!=='mp')updEnt(e);
      for(let i=0;i<ents.length;i++){const a=ents[i];if(a.type!=='dar'&&a.type!=='uni')continue;
        for(let j=i+1;j<ents.length;j++){const b=ents[j];if((b.type==='dar'||b.type==='uni')&&overlap(a,b)){if(a.x<b.x){a.dir=-1;b.dir=1;}else{a.dir=1;b.dir=-1;}}}}
      if(G.state==='play'&&lvl.pole!==null&&P.x+P.w>=lvl.pole*T+6)startGoal();
      if(lvl.check&&P.x>lvl.check*T)G.check=true;
      updCamera();
      if(G.state==='play'){timeTick++;if(timeTick>=24){timeTick=0;G.time--;
        if(G.time===100&&!hurry){hurry=true;SFX.hurry();Music.speed=1.3;}
        if(G.time<=0){G.time=0;die(false);}}}
      break;
    case 'dead':
      if(!P.pit){if(G.stateT===30)P.vy=-6.8;if(G.stateT>30){P.vy+=0.3;P.y+=P.vy;}}
      for(const e of ents)if(e.type==='flip'||e.type==='mp')updEnt(e);
      if(G.stateT>210){G.lives--;if(G.lives<=0){saveHi();G.deathWorld=G.world;G.state='gameover';G.stateT=0;SFX.gameover();}else{G.state='card';G.stateT=0;}}
      break;
    case 'goal':
      for(const e of ents)updEnt(e);
      updGoal();updCamera();
      break;
    case 'gameover':
      if(G.stateT>60&&inp.jumpP){titleStart(WORLD_START[G.deathWorld]);break;} // continue from the top of that world
      if(G.stateT>420||(G.stateT>60&&inp.startP)){G.state='title';G.stateT=0;lvl=LEVELS[0]();ents=[];P=null;boss=null;}
      break;
    case 'ending':
      if(G.stateT>ENDING_READY&&(inp.startP||inp.jumpP)){Music.stop();saveHi();G.state="title";G.stateT=0;lvl=LEVELS[0]();ents=[];P=null;boss=null;}
      break;
  }

  ctx.globalAlpha=a;txt('THE END',W/2,92,'#ffd23f',20,'center');ctx.globalAlpha=1;
  if(t>END_SCORE)txt('SCORE '+pad(G.score,6)+'   HI '+pad(G.hi,6),W/2,126,'#ffffff',9,'center');
  if(t>ENDING_READY&&(G.frame>>5)%2===0)txt(TOUCHDEV?'Aボタンで タイトルへ':'ENTER で タイトルへ',W/2,148,'#ffd23f',9,'center');
}
function render(){
  ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=false;
  const st=G.state;
  if(st==='card'){drawCard();return;}
  if(st==='gameover'){drawGameOver();return;}
  if(st==='ending'){drawEnding();return;}
  if(st==='title'){drawWorld(0,G.frame*0.2);drawTitle();return;}
  const cx=Math.round(cam);
  if(shake>0){const sx=Math.round(Math.random()*4-2),sy=Math.round(Math.random()*4-2);ctx.setTransform(K,0,0,K,sx*K,sy*K);}
  drawWorld(cx,0);
  ctx.setTransform(K,0,0,K,0,0);
  drawHUD();
  if(G.paused){ctx.fillStyle='rgba(11,9,20,0.6)';ctx.fillRect(0,0,W,H);txt('PAUSE',W/2,100,'#ffffff',16,'center');txt(TOUCHDEV?'START で さいかい':'ENTER で さいかい',W/2,128,'#f3ecd8',9,'center');}
}

// ================= LOOP =================
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=STEP){step();acc-=STEP;}
  render();requestAnimationFrame(loop);
}
if(document.fonts&&document.fonts.load){document.fonts.load(`10px "DotGothic16"`).catch(()=>{});}
cv.focus();
requestAnimationFrame(loop);
})();
</script>
